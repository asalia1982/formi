<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de estudiantes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Registro de estudiantes</h1>

    <form id="formulario">
      <input id="cuenta" placeholder="Número de cuenta" required>
      <input id="nombre" placeholder="Nombre completo" required>
      <input id="carrera" placeholder="Carrera" required>
      <button>Registrar</button>
    </form>

    <p id="mensaje" role="status"></p>
    <button id="exportar">Exportar a CSV</button>

    <table>
      <thead>
        <tr>
          <th>Cuenta</th><th>Nombre</th>
          <th>Carrera</th><th>Acción</th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>
  </main>
  <script src="script.js"></script>
</body>
</html>
